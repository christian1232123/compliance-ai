<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Compliance AI</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1b2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1b263b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
        }
        h1 { font-size: 24px; margin-bottom: 8px; color: #4cc9f0; }
        p { font-size: 14px; color: #e0e1dd; margin-bottom: 24px; }
        label { font-size: 13px; font-weight: bold; display: block; margin-bottom: 6px; }
        select, input[type="file"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 18px;
            border-radius: 6px;
            border: 1px solid #415a77;
            background-color: #0d1b2a;
            color: white;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #0077b6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background-color: #0096c7; }
        #result { margin-top: 20px; font-size: 14px; padding: 12px; border-radius: 6px; display: none; }
        .success { background-color: #1b4332; border: 1px solid #2d6a4f; color: #d8f3dc; }
        .error { background-color: #4a1525; border: 1px solid #800f2f; color: #ffccd5; }
    </style>
</head>
<body>

<div class="container">
    <h1>Audit Compliance AI</h1>
    <p>Carica un documento PDF per generare un report automatico sulle criticità normative.</p>
    
    <form id="uploadForm">
        <label for="standard">Standard di Riferimento</label>
        <select id="standard">
            <option value="GDPR">GDPR & Normativa Privacy</option>
            <option value="ISO27001">ISO 27001 (Sicurezza informazioni)</option>
        </select>

        <label for="pdfFile">Seleziona Documento PDF</label>
        <input type="file" id="pdfFile" accept=".pdf" required>

        <button type="submit" id="submitBtn">Avvia Analisi Audit</button>
    </form>

    <div id="result"></div>
</div>

<script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const fileInput = document.getElementById('pdfFile');
        const submitBtn = document.getElementById('submitBtn');
        const resultDiv = document.getElementById('result');
        
        if (!fileInput.files[0]) return;

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        submitBtn.disabled = true;
        submitBtn.innerText = "Analisi in corso con l'IA...";
        resultDiv.style.display = 'none';

        try {
            // Usa l'URL relativo invece di localhost
            const response = await fetch('/analyze', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            resultDiv.style.display = 'block';
            if (response.ok) {
                resultDiv.className = 'success';
                resultDiv.innerText = data.message || "Analisi completata con successo!";
            } else {
                resultDiv.className = 'error';
                resultDiv.innerText = data.error || "Errore durante l'elaborazione.";
            }
        } catch (err) {
            resultDiv.style.display = 'block';
            resultDiv.className = 'error';
            resultDiv.innerText = "Impossibile connettersi al Server Backend.";
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Avvia Analisi Audit";
        }
    });
</script>

</body>
</html>
